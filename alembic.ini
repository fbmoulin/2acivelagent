# Sistema de Automacao Juridica - Alembic Configuration
# Database migration management

[alembic]
# Path to migration scripts
script_location = migrations

# Template used to generate migration files
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d%%(second).2d_%%(rev)s_%%(slug)s

# Truncate long revision names
truncate_slug_length = 40

# Timezone for migration generation
timezone = America/Sao_Paulo

# Prepend sys.path for model imports
prepend_sys_path = .

# Version path separator (os-specific if not set)
version_path_separator = os

# Output encoding
output_encoding = utf-8

# SQLAlchemy URL (can be overridden by env)
# Use env variable in production
sqlalchemy.url = postgresql://n8n_user:password@localhost:5432/n8n


[post_write_hooks]
# Post-write hooks for migration files

# Black formatting
hooks = black
black.type = console_scripts
black.entrypoint = black
black.options = -q


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
